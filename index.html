<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pop-It Bingo</title>
  <meta name="theme-color" content="#121836" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="description" content="Mobile-friendly Pop-It Bingo prototype" />
</head>
<body>
  <main>
    <h1 class="title" aria-label="Game title">Pop-It Bingo</h1>

    <section class="controls-section" aria-label="Game controls">
      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn">Reset</button>
        <label class="toggle" for="autoMarkToggle">
          <input type="checkbox" id="autoMarkToggle" aria-label="Auto mark called numbers" />
          <span>Auto-mark</span>
          <span class="toggle-state" id="autoMarkState" aria-live="polite">Off</span>
        </label>
      </div>
    </section>

    <section class="status" aria-live="polite">
      <div class="called-summary">
        <span id="numbersCalledLabel">Numbers called:</span>
  <span id="numbersCalledCount">0/20</span>
        <span class="last-call">Last call: <strong id="lastCall">-</strong></span>
      </div>
    </section>

    <section class="board-section" aria-label="Your ticket">
      <div id="board" class="board" role="grid" aria-label="4x4 bingo grid"></div>
    </section>

    <section class="prize-key" aria-label="Prize Key">
      <h2>Prize Key</h2>
      <ul id="prizeKey" class="prize-list"></ul>
    </section>

    <section class="called-stream" aria-label="Called numbers">
      <div id="calledStream" class="stream"></div>
    </section>
  </main>

  <!-- Stake Selection Modal -->
  <div id="stakeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="stakeTitle" aria-describedby="stakeBody">
    <div class="modal-content">
      <h2 id="stakeTitle">Choose Your Stake</h2>
      <p id="stakeBody">Select the stake you would like to play at! You get 1 ticket per game and prizes vary by stake.</p>
      <div class="stake-grid">
        <button class="stake-option" data-stake="0.10">10p</button>
        <button class="stake-option" data-stake="0.25">25p</button>
        <button class="stake-option" data-stake="0.50">50p</button>
        <button class="stake-option" data-stake="0.75">75p</button>
        <button class="stake-option" data-stake="1.00">£1</button>
        <button class="stake-option" data-stake="1.50">£1.50</button>
        <button class="stake-option" data-stake="2.50">£2.50</button>
      </div>
    </div>
  </div>

  <!-- End-of-Game Modal -->
  <div id="endModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="modal-content center">
      <h2 id="endTitle">Game Over</h2>
      <p id="endSummary"></p>
      <button id="playAgainBtn">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
  <noscript>You need JavaScript enabled to play.</noscript>
  <!-- Simple analytics/diagnostics could go here if needed -->
  <link rel="preload" href="styles.css" as="style">
  <link rel="preload" href="script.js" as="script">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="robots" content="noindex" />
  <!-- Note: remove robots noindex if you want it indexed. -->
  
</body>
</html><!DOCTYPE html>
